# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Cada conexão usa UTC: o NOW() do SQL grava a hora UTC nas colunas sem fuso.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# JPA
# Esquema manual: o Hibernate não mexe no banco (padrão none).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
# SQL no log: desligado. Para diagnóstico, SPRING_JPA_SHOW_SQL=true no Render.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Validação dos dígitos do CPF: desligada na fase de testes (ligar com APP_VALIDAR_CPF_DIGITOS=true)
app.validar-cpf-digitos=${APP_VALIDAR_CPF_DIGITOS:false}

# Parte 5: matriz de permissões (rota x perfil). Desligada até o app mandar o token em todas as chamadas.
app.seguranca.exigir-jwt=${APP_SEGURANCA_EXIGIR_JWT:false}
# Origens do front para o CORS, separadas por vírgula. * = qualquer uma (como antes).
app.cors.origens=${APP_CORS_ORIGENS:*}
# Bloqueios dos itens 9 e 15 (PIN, diário pendente, sair de serviço com diário aberto). false desliga.
app.bloqueios.diario=${APP_BLOQUEIOS_DIARIO:true}
# Parte 6C: datas das respostas com Z (UTC). Ligar só quando o app ler datas com fuso.
app.datas-com-fuso=${APP_DATAS_COM_FUSO:false}
# Parte 7: Swagger em /swagger-ui.html e /v3/api-docs. Desligado por padrão; ligar com SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
# Parte 9: fotos. O app reduz a foto (1920 px, JPEG 80, ~400-800 KB); o limite fica com folga.
spring.servlet.multipart.max-file-size=${APP_FOTO_MAX_ARQUIVO:5MB}
spring.servlet.multipart.max-request-size=${APP_FOTO_MAX_REQUISICAO:6MB}
# No máximo N fotos sendo gravadas ao mesmo tempo (memória da Render gratuita).
app.foto.envios-simultaneos=${APP_FOTO_ENVIOS_SIMULTANEOS:2}
